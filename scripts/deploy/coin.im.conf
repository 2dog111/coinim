server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.coin.im;
    ssl_certificate /etc/letsencrypt/live/coin.im/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coin.im/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://coin.im$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coin.im;
    ssl_certificate /etc/letsencrypt/live/coin.im/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coin.im/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/coin.im.access.log main;
    error_log /var/log/nginx/coin.im.error.log warn;
    client_max_body_size 100k;
    location / {
        proxy_pass http://127.0.0.1:3216;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location ^~ /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:3216;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    listen [::]:80;
    server_name www.coin.im;
    return 301 https://coin.im$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coin.im 193.181.215.57 _;
    return 301 https://coin.im$request_uri;
}
