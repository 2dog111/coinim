location = / {
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8782;
}

location = /takeover { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location = /archive { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location = /stats { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location = /rules { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location = /admin { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location ^~ /admin/ { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location ^~ /message/ { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location ^~ /reign/ { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location ^~ /receipt/ {
    access_log off;
    include /etc/nginx/snippets/coin-im-market-proxy.conf;
}
location ^~ /badge/ { include /etc/nginx/snippets/coin-im-market-proxy.conf; }
location ^~ /result/ { include /etc/nginx/snippets/coin-im-market-proxy.conf; }

location ^~ /api/market/receipt/ {
    access_log off;
    proxy_buffering off;
    proxy_read_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8782;
}

location ^~ /api/market/ {
    proxy_buffering off;
    proxy_read_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8782;
}
